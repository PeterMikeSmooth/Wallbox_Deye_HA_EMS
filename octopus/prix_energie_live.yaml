# ---------------------------------------------------------------------------
# Prix de l'énergie en temps réel — Linky HC/HP + remboursement Octopus EV
#
# À coller dans configuration.yaml. Si une clé `template:` existe déjà, ne
# recopier que le bloc `- sensor:` à la suite de celles qui s'y trouvent.
# Puis : Outils de développement > YAML > « Recharger les entités template ».
#
# Conventions de calcul :
#   - channel_1 est signé : + = import réseau, − = export solaire.
#     L'export est valorisé 0 € (pas de rachat), donc la part réseau est
#     bornée à zéro et ne peut jamais créer un faux gain.
#   - Le remboursement Octopus est calculé en `tarif − 0.08`, pas en dur :
#     0.1656 − 0.08 = 0.0856 €/kWh en HC, 0.216 − 0.08 = 0.136 €/kWh en HP.
#     Si Linky change ses tarifs, le remboursement suit tout seul.
#   - Le remboursement porte sur les kWh entrés dans la voiture, quelle que
#     soit leur origine (réseau ou solaire) : il est donc soustrait
#     intégralement, indépendamment de la part réseau.
#
# Rappel d'unités, parce que c'est le piège de tout ce calcul :
#     kW × €/kWh = €/h      (un débit de dépense)
#     €/h ÷ kW   = €/kWh    (un prix)
#   Voiture à 2,6 kW sur du solaire en HC : le débit est −0,22 €/h, et le
#   prix du kWh est −0,0856 €/kWh. Multiplier 2,6 par 0,0856 ne donne pas un
#   prix, ça donne le débit.
#
#   Les deux capteurs ne lisent que les 2 pinces Shelly + les 3 entités Linky.
#
#   SEUIL VOITURE : la Wallbox tire ~7 W de veille en permanence, même borne
#   verrouillée et sans voiture. Ces watts sont bien consommés, mais aucun kWh
#   n'entre dans la voiture, donc ils n'ouvrent aucun droit au remboursement.
#   En dessous de 40 W la puissance voiture est donc traitée comme nulle.
#   Le seuil est celui de `config.EV_CHARGING_DETECT_W`, déjà utilisé par ems.py.
#
#   DEUX FACTEURS s'appliquent au SEUL terme de remboursement (la base facturée
#   du €/kWh reste l'énergie réellement tirée) :
#
#   1. `input_number.rendement_borne` = 0,9688 — PHYSIQUE. La pince mesure à
#      l'entrée de la borne (électronique, veille, pertes internes comprises),
#      la borne compte ce qu'elle délivre à la voiture. Mesuré sur 5 mois de
#      relevés de l'appli Wallbox, écart-type 0,0019. Très stable.
#
#   2. `input_number.part_bonus_octopus` = **1,0 — NEUTRALISÉ le 24/09**.
#      Ce facteur encaissait l'écart entre le bonus théorique (règle A) et
#      celui réellement versé : 214,43 € dus contre 182,13 € versés sur
#      mai-août, soit 84,94 %, donc 32,30 € manquants. Comme cet écart n'est
#      **pas expliqué**, on refuse de le normaliser : les capteurs affichent
#      désormais ce qu'Octopus DOIT, pas ce qu'il verse. À réactiver à 0,849
#      seulement si Octopus fournit une raison valable — sinon c'est une
#      créance, pas une correction. Le repli vaut 1,0 pour la même raison.
#
#   ATTENTION au sens du second, il a changé. On a d'abord cru qu'Octopus ne
#   comptait que ~87 % des kWh : c'est FAUX. L'appariement session par session
#   (API Kraken contre export Wallbox, recouvrement 24→31/08) montre qu'il en
#   compte 98 %, avec 0,30 kWh seulement de sessions orphelines. Ce facteur
#   n'est donc pas une perte de kWh mais un ÉCART DE TAUX, encore inexpliqué,
#   qui varie de 79 % à 95 % selon le mois. À revalider à chaque facture.
#
#   Chaîne : kWh Shelly → ×0,9688 (pertes borne) → kWh comptés par Octopus
#            → ×0,849 (écart de taux) → bonus réellement perçu.
# ---------------------------------------------------------------------------

template:
  - sensor:

      # -- 1. Débit de dépense instantané, en €/h ---------------------------
      #    (kW réseau importés × tarif) − (kW voiture × remboursement)
      #    Aucune division : ce capteur est valide en toutes circonstances,
      #    y compris réseau à zéro pile. C'est celui à mettre en gros.
      - name: "Coût énergie live"
        unique_id: cout_energie_live
        unit_of_measurement: "€/h"
        state_class: measurement
        availability: >
          {{ has_value('sensor.shellyem_34945478aee1_channel_1_power')
             and has_value('sensor.shellyem_34945478aee1_channel_2_power')
             and has_value('sensor.linky_25348914432154_off_peak_hours_rate')
             and has_value('sensor.linky_25348914432154_peak_hours_rate') }}
        state: >
          {% set grid_w = states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) %}
          {% set ev_w   = states('sensor.shellyem_34945478aee1_channel_2_power') | float(0) %}
          {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
          {% set tarif = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                         else states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set remb = tarif - 0.08 %}
          {% set import_kw = ([grid_w, 0] | max) / 1000 %}
          {% set k = states('input_number.rendement_borne') | float(0.9686)
                    * (states('input_number.part_bonus_octopus') | float(1.0)) %}
          {% set ev_kw = (ev_w / 1000 if ev_w > 40 else 0) * k %}
          {{ (import_kw * tarif - ev_kw * remb) | round(3) }}
        attributes:
          heures_creuses: >
            {{ is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') }}
          tarif_en_cours: >
            {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
            {{ (states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                else states('sensor.linky_25348914432154_peak_hours_rate') | float(0)) | round(4) }}
          remboursement_ev: >
            {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
            {{ ((states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                 else states('sensor.linky_25348914432154_peak_hours_rate') | float(0)) - 0.08) | round(4) }}
          cout_reseau_h: >
            {% set grid_w = states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) %}
            {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
            {% set tarif = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                           else states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
            {{ ((([grid_w, 0] | max) / 1000) * tarif) | round(3) }}
          gain_ev_h: >
            {% set ev_w = states('sensor.shellyem_34945478aee1_channel_2_power') | float(0) %}
            {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
            {% set remb = (states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                           else states('sensor.linky_25348914432154_peak_hours_rate') | float(0)) - 0.08 %}
            {{ (0 - (ev_w / 1000 if ev_w > 40 else 0) * remb) | round(3) }}
          puissance_reseau_w: >
            {{ states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) | round(0) }}
          puissance_ev_w: >
            {{ states('sensor.shellyem_34945478aee1_channel_2_power') | float(0) | round(0) }}

      # -- 2. Prix moyen du kWh facturé, en €/kWh --------------------------
      #    = coût horaire ÷ base facturée.
      #
      #    Base facturée = max(import réseau, puissance voiture, 50 W).
      #    On ne moyenne QUE les kWh qui ont un prix : ceux achetés au réseau
      #    et ceux qui déclenchent le remboursement Octopus. Le solaire que
      #    boit la maison est gratuit et n'entre pas dans la moyenne — c'est
      #    la différence avec un dénominateur « conso totale », qui diluerait
      #    le prix vers zéro (maison 1 kW réseau + 1 kW solaire : 0.216 €/kWh
      #    ici, contre 0.108 avec la conso totale).
      #
      #    Le `max` entre réseau et voiture est ce qui rend le calcul possible
      #    sans mesurer la maison : quand le solaire couvre tout, l'import
      #    tombe à zéro mais la voiture, elle, tire toujours ses kW, donc le
      #    dénominateur ne s'écrase jamais. Le plancher à 50 W couvre le seul
      #    cas restant — ni import ni voiture — où le coût vaut 0 de toute
      #    façon. Aucune dépendance au Deye ni à l'Envoy : ce capteur ne lit
      #    que les deux pinces Shelly et les tarifs Linky.
      #
      #    Bornes : entre −remboursement (voiture au solaire) et +tarif
      #    (réseau seul, pas de voiture).
      - name: "Prix kWh effectif"
        unique_id: prix_kwh_effectif
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: >
          {{ has_value('sensor.shellyem_34945478aee1_channel_1_power')
             and has_value('sensor.shellyem_34945478aee1_channel_2_power')
             and has_value('sensor.linky_25348914432154_off_peak_hours_rate')
             and has_value('sensor.linky_25348914432154_peak_hours_rate') }}
        state: >
          {% set grid_w = states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) %}
          {% set ev_w   = states('sensor.shellyem_34945478aee1_channel_2_power') | float(0) %}
          {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
          {% set tarif = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                         else states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set remb = tarif - 0.08 %}
          {% set import_kw = ([grid_w, 0] | max) / 1000 %}
          {% set k = states('input_number.rendement_borne') | float(0.9686)
                    * (states('input_number.part_bonus_octopus') | float(1.0)) %}
          {% set ev_kw = (ev_w / 1000 if ev_w > 40 else 0) * k %}
          {% set base_kw = [import_kw, (ev_w / 1000 if ev_w > 40 else 0), 0.05] | max %}
          {{ ((import_kw * tarif - ev_kw * remb) / base_kw) | round(4) }}
        attributes:
          base_facturee_w: >
            {% set grid_w = states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) %}
            {% set ev_w = states('sensor.shellyem_34945478aee1_channel_2_power') | float(0) %}
            {{ ([([grid_w, 0] | max), (ev_w if ev_w > 40 else 0), 50] | max) | round(0) }}
          tarif_en_cours: >
            {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
            {{ (states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                else states('sensor.linky_25348914432154_peak_hours_rate') | float(0)) | round(4) }}
          remboursement_ev: >
            {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
            {{ ((states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                 else states('sensor.linky_25348914432154_peak_hours_rate') | float(0)) - 0.08) | round(4) }}
          part_reseau_pct: >
            {% set grid_w = states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) %}
            {% set ev_w = states('sensor.shellyem_34945478aee1_channel_2_power') | float(0) %}
            {% set base = [([grid_w, 0] | max), (ev_w if ev_w > 40 else 0), 50] | max %}
            {{ (100 * ([grid_w, 0] | max) / base) | round(0) }}

      # =====================================================================
      # COÛTS CUMULÉS — jour et mois calendaire
      #
      # Structure : abonnement + kWh réseau valorisés au tarif de la plage
      # horaire où ils ont été consommés − remboursement Octopus sur les kWh
      # entrés dans la voiture, lui aussi ventilé HC/HP.
      #
      # La ventilation HC/HP vient de 4 utility_meter à tarifs, dont le tarif
      # est basculé par l'automatisation « Tarif HC/HP — bascule des compteurs
      # d'énergie » sur le binary_sensor du Linky :
      #   sensor.grid_reseau_jour_hc  / _hp   (source: channel_1_energy)
      #   sensor.grid_reseau_mois_hc  / _hp
      #   sensor.evse_voiture_jour_hc / _hp   (source: channel_2_energy)
      #   sensor.evse_voiture_mois_hc / _hp
      #
      # L'abonnement journalier est lu dans les attributs du dernier relevé
      # Linky (`cout_abonnement_euro`, 0.628 €/j) — c'est le chiffre
      # qu'Octopus applique. Repli sur 0.628 si l'attribut manque.
      #
      # PIÈGE D'UNITÉ : un utility_meter hérite l'unité de sa source.
      # channel_1_energy est en **MWh**, channel_2_energy en **kWh** — les
      # compteurs réseau sont donc en MWh et les compteurs voiture en kWh.
      # Les facteurs kg/ke ci-dessous ramènent tout en kWh en lisant l'unité
      # réelle de l'entité, pour ne pas se faire piéger si elle change.
      #
      # Attention : les kWh réseau viennent de la pince Shelly (temps réel),
      # pas de l'index Enedis (exact mais à J-4). Un écart de quelques % avec
      # la facture est normal et attendu.
      # =====================================================================

      - name: "Coût énergie jour"
        unique_id: cout_energie_jour
        unit_of_measurement: "€"
        state_class: total
        availability: >
          {{ has_value('sensor.linky_25348914432154_off_peak_hours_rate')
             and has_value('sensor.linky_25348914432154_peak_hours_rate') }}
        state: >
          {% set abo = state_attr('sensor.linky_25348914432154_latest_reading', 'cout_abonnement_euro') | float(0.628) %}
          {% set r_hc = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) %}
          {% set r_hp = states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set ug = state_attr('sensor.grid_reseau_jour_hc', 'unit_of_measurement') %}
          {% set ue = state_attr('sensor.evse_voiture_jour_hc', 'unit_of_measurement') %}
          {% set kg = 1000 if ug == 'MWh' else (0.001 if ug == 'Wh' else 1) %}
          {% set ke = 1000 if ue == 'MWh' else (0.001 if ue == 'Wh' else 1) %}
          {% set g_hc = states('sensor.grid_reseau_jour_hc') | float(0) * kg %}
          {% set g_hp = states('sensor.grid_reseau_jour_hp') | float(0) * kg %}
          {% set k = states('input_number.rendement_borne') | float(0.9686)
                    * (states('input_number.part_bonus_octopus') | float(1.0)) %}
          {% set e_hc = states('sensor.evse_voiture_jour_hc') | float(0) * ke * k %}
          {% set e_hp = states('sensor.evse_voiture_jour_hp') | float(0) * ke * k %}
          {{ (abo
              + g_hc * r_hc + g_hp * r_hp
              - e_hc * (r_hc - 0.08) - e_hp * (r_hp - 0.08)) | round(2) }}

      - name: "Coût énergie mois"
        unique_id: cout_energie_mois
        unit_of_measurement: "€"
        state_class: total
        availability: >
          {{ has_value('sensor.linky_25348914432154_off_peak_hours_rate')
             and has_value('sensor.linky_25348914432154_peak_hours_rate') }}
        state: >
          {% set abo = state_attr('sensor.linky_25348914432154_latest_reading', 'cout_abonnement_euro') | float(0.628) %}
          {% set r_hc = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) %}
          {% set r_hp = states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set ug = state_attr('sensor.grid_reseau_mois_hc', 'unit_of_measurement') %}
          {% set ue = state_attr('sensor.evse_voiture_mois_hc', 'unit_of_measurement') %}
          {% set kg = 1000 if ug == 'MWh' else (0.001 if ug == 'Wh' else 1) %}
          {% set ke = 1000 if ue == 'MWh' else (0.001 if ue == 'Wh' else 1) %}
          {% set g_hc = states('sensor.grid_reseau_mois_hc') | float(0) * kg %}
          {% set g_hp = states('sensor.grid_reseau_mois_hp') | float(0) * kg %}
          {% set k = states('input_number.rendement_borne') | float(0.9686)
                    * (states('input_number.part_bonus_octopus') | float(1.0)) %}
          {% set e_hc = states('sensor.evse_voiture_mois_hc') | float(0) * ke * k %}
          {% set e_hp = states('sensor.evse_voiture_mois_hp') | float(0) * ke * k %}
          {{ (abo * now().day
              + g_hc * r_hc + g_hp * r_hp
              - e_hc * (r_hc - 0.08) - e_hp * (r_hp - 0.08)) | round(2) }}

      # =====================================================================
      # DÉCOMPOSITION DU MOIS — pour recouper avec les données d'Octopus
      #
      #   facture_hors_bonus_mois − remboursement_ev_mois = cout_energie_mois
      #
      # L'identité est EXACTE avec `remboursement_ev_mois`, qui est calculé
      # depuis la pince Shelly comme `cout_energie_mois`. Elle ne l'est PAS
      # avec `sensor.octopus_bonus_attendu`, qui vient de l'archive des
      # sessions Octopus sur le Pi : les deux remboursements diffèrent d'une
      # dizaine de pourcents, et cet écart EST l'inconnue « étage 2 »
      # (compteur de la borne -> kWh retenus par Octopus). Le laisser visible
      # est volontaire : c'est l'indicateur à surveiller.
      # =====================================================================

      - name: "Facture hors bonus mois"
        unique_id: facture_hors_bonus_mois
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        availability: >
          {{ has_value('sensor.linky_25348914432154_off_peak_hours_rate')
             and has_value('sensor.linky_25348914432154_peak_hours_rate') }}
        state: >
          {% set abo = state_attr('sensor.linky_25348914432154_latest_reading', 'cout_abonnement_euro') | float(0.628) %}
          {% set r_hc = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) %}
          {% set r_hp = states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set ug = state_attr('sensor.grid_reseau_mois_hc', 'unit_of_measurement') %}
          {% set kg = 1000 if ug == 'MWh' else (0.001 if ug == 'Wh' else 1) %}
          {% set g_hc = states('sensor.grid_reseau_mois_hc') | float(0) * kg %}
          {% set g_hp = states('sensor.grid_reseau_mois_hp') | float(0) * kg %}
          {{ (abo * now().day + g_hc * r_hc + g_hp * r_hp) | round(2) }}
        attributes:
          abonnement: >
            {{ ((state_attr('sensor.linky_25348914432154_latest_reading', 'cout_abonnement_euro') | float(0.628))
                * now().day) | round(2) }}
          reseau: >
            {% set r_hc = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) %}
            {% set r_hp = states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
            {% set ug = state_attr('sensor.grid_reseau_mois_hc', 'unit_of_measurement') %}
            {% set kg = 1000 if ug == 'MWh' else (0.001 if ug == 'Wh' else 1) %}
            {{ ((states('sensor.grid_reseau_mois_hc') | float(0) * kg) * r_hc
              + (states('sensor.grid_reseau_mois_hp') | float(0) * kg) * r_hp) | round(2) }}

      - name: "Remboursement EV mois"
        unique_id: remboursement_ev_mois
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        availability: >
          {{ has_value('sensor.linky_25348914432154_off_peak_hours_rate')
             and has_value('sensor.linky_25348914432154_peak_hours_rate') }}
        state: >
          {% set r_hc = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) %}
          {% set r_hp = states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set ue = state_attr('sensor.evse_voiture_mois_hc', 'unit_of_measurement') %}
          {% set ke = 1000 if ue == 'MWh' else (0.001 if ue == 'Wh' else 1) %}
          {% set k = states('input_number.rendement_borne') | float(0.9688)
                    * (states('input_number.part_bonus_octopus') | float(1.0)) %}
          {% set e_hc = states('sensor.evse_voiture_mois_hc') | float(0) * ke * k %}
          {% set e_hp = states('sensor.evse_voiture_mois_hp') | float(0) * ke * k %}
          {{ (e_hc * (r_hc - 0.08) + e_hp * (r_hp - 0.08)) | round(2) }}
        attributes:
          ecart_vs_octopus: >
            {% set o = states('sensor.octopus_bonus_attendu') | float(0) %}
            {% set r_hc = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) %}
            {% set r_hp = states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
            {% set ue = state_attr('sensor.evse_voiture_mois_hc', 'unit_of_measurement') %}
            {% set ke = 1000 if ue == 'MWh' else (0.001 if ue == 'Wh' else 1) %}
            {% set k = states('input_number.rendement_borne') | float(0.9688)
                      * (states('input_number.part_bonus_octopus') | float(1.0)) %}
            {% set m = (states('sensor.evse_voiture_mois_hc') | float(0) * ke * k) * (r_hc - 0.08)
                     + (states('sensor.evse_voiture_mois_hp') | float(0) * ke * k) * (r_hp - 0.08) %}
            {{ (m - o) | round(2) if o > 0 else 'archive indisponible' }}

      - name: "Shelly charge mois"
        unique_id: shelly_charge_mois
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        availability: "{{ has_value('sensor.evse_voiture_mois_hc') }}"
        state: >
          {% set ue = state_attr('sensor.evse_voiture_mois_hc', 'unit_of_measurement') %}
          {% set ke = 1000 if ue == 'MWh' else (0.001 if ue == 'Wh' else 1) %}
          {{ ((states('sensor.evse_voiture_mois_hc') | float(0)
             + states('sensor.evse_voiture_mois_hp') | float(0)) * ke) | round(2) }}
        attributes:
          borne_estimee: >
            {% set ue = state_attr('sensor.evse_voiture_mois_hc', 'unit_of_measurement') %}
            {% set ke = 1000 if ue == 'MWh' else (0.001 if ue == 'Wh' else 1) %}
            {{ ((states('sensor.evse_voiture_mois_hc') | float(0)
               + states('sensor.evse_voiture_mois_hp') | float(0)) * ke
               * (states('input_number.rendement_borne') | float(0.9688))) | round(2) }}
          etage2_vs_octopus: >
            {% set ue = state_attr('sensor.evse_voiture_mois_hc', 'unit_of_measurement') %}
            {% set ke = 1000 if ue == 'MWh' else (0.001 if ue == 'Wh' else 1) %}
            {% set borne = (states('sensor.evse_voiture_mois_hc') | float(0)
                          + states('sensor.evse_voiture_mois_hp') | float(0)) * ke
                          * (states('input_number.rendement_borne') | float(0.9688)) %}
            {% set o = states('sensor.octopus_smartcharge_mois') | float(0) %}
            {{ (o / borne) | round(4) if (borne > 0 and o > 0) else 'indisponible' }}

      # -- Étage 2 : ce qu'Octopus retient, rapporté au compteur de la borne --
      #    < 1 = Octopus compte moins que la borne n'a délivré.
      #    Mesures contradictoires à ce jour : 0,905 (avril, totaux mensuels),
      #    0,982 (24→31/08, appariement session par session), 0,891 (septembre).
      #    À surveiller : c'est l'inconnue qui reste dans toute la chaîne.
      #    NB : les attributs ne sont pas déployables via l'assistant Template
      #    de l'UI (pas de champ `attributes`), d'où ce capteur dédié.
      - name: "Etage2 Octopus sur borne"
        unique_id: etage2_octopus_sur_borne
        state_class: measurement
        availability: >
          {{ has_value('sensor.octopus_smartcharge_mois')
             and has_value('sensor.evse_voiture_mois_hc') }}
        state: >
          {% set ue = state_attr('sensor.evse_voiture_mois_hc', 'unit_of_measurement') %}
          {% set ke = 1000 if ue == 'MWh' else (0.001 if ue == 'Wh' else 1) %}
          {% set borne = (states('sensor.evse_voiture_mois_hc') | float(0)
                        + states('sensor.evse_voiture_mois_hp') | float(0)) * ke
                        * (states('input_number.rendement_borne') | float(0.9688)) %}
          {% set o = states('sensor.octopus_smartcharge_mois') | float(0) %}
          {{ (o / borne) | round(4) if (borne > 0 and o > 0) else 0 }}

      # =====================================================================
      # ÉCONOMIES — ce que les panneaux et la batterie évitent d'acheter
      #
      # Bilan instantané (W) avec les conventions de l'EMS :
      #   G = channel_1 (+ import), P = deye_microinverter_power (tout le PV),
      #   B = deye_battery_power (+ décharge)
      #   conso   = max(G + P + B, 0)          maison + voiture, pertes Deye incluses
      #   solaire = min(P, conso)              le PV sert la conso en premier
      #   batt    = conso − import − solaire   le reste non acheté vient de la batterie
      # Chaque terme est valorisé au tarif HC/HP de l'instant.
      #
      #   - Le solaire qui CHARGE la batterie n'est pas compté côté solaire :
      #     il l'est à la décharge, côté batterie. Pas de double compte.
      #   - Batterie chargée depuis le réseau : `batt` devient négatif et
      #     retranche ce coût. L'économie batterie est donc un gain NET.
      #   - Batterie qui se vide pendant un export : le solaire est servi en
      #     premier, donc la décharge exportée ne compte pas comme économie.
      #   - Export valorisé 0 € (même règle que ci-dessus).
      #   - Voiture : le remboursement Octopus existe avec ou sans soleil, il
      #     s'annule dans la différence. Un kWh solaire dans la voiture vaut
      #     donc le tarif plein, comme dans la maison.
      #
      # Chaîne (helpers UI, créés par config flow REST le 26/09) :
      #   économie_{solaire,batterie}_live (€/h)
      #     → integration « left », max_sub_interval 1 min → *_cumul (€)
      #     → economie_totale_cumul = somme des deux (template)
      #     → utility_meter : economie_solaire_jour, economie_batterie_jour (daily)
      #                       economie_solaire_mois, economie_batterie_mois (monthly)
      #                       economie_solaire_batterie_mois (monthly)
      #                       economie_{solaire,batterie,solaire_batterie}_annee (yearly)
      #
      # Coût sans panneaux ni batterie = coût réel + économies (helpers UI, 26/09) :
      #   jour/mois : cout_energie_{jour,mois} + economie_*  (templates)
      #   année     : cout_energie_live → integration cout_energie_cumul
      #               → utility_meter yearly cout_energie_variable_annee
      #               → cout_energie_annee = variable + abo × jour de l’année
      #               → cout_sans_panneaux_ni_batterie_annee = cout_energie_annee + economie_solaire_batterie_annee
      #                 − rachat_surplus_annee (idem jour/mois/vie : coût sans = facture + économies − rachat)
      #   vie       : utility_meter cycle none sur les cumuls ; cout_energie_vie = integration de
      #               cout_energie_live + abonnement/24 (template « Coût énergie live avec abonnement »)
      #   rachat    : rachat_surplus_live → cumul → rachat_surplus_{jour,mois,annee,vie}
      #   amortir   : reste_a_amortir_{installation,batterie} = 10384,77 / 3002 − économies vie,
      #               rentabilite_{installation,batterie} = date estimée (device_class date)
      #   Compteurs en net_consumption: true + periodically_resetting: false,
      #   sinon une recharge réseau (delta négatif) serait prise pour un reset.
      # =====================================================================

      # MAJ 26/09 (§14.p du mémo) : grille hybride (import Shelly, export Deye — le Shelly
      # invente ~50 W d'injection la nuit depuis le Deye), veille des micros ignorée (≤ 15 W),
      # rachat Urban Solar « boost » au prix input_number.prix_rachat_surplus. Le solaire
      # stocké est valorisé au prix de rachat côté panneaux et retranché côté batterie.
      - name: "Économie solaire live"
        unique_id: economie_solaire_live
        unit_of_measurement: "€/h"
        state_class: measurement
        state: >
          {% set gs = states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) %}
          {% set gd = states('sensor.deye_grid_power') | float(0) %}
          {% set g = gs if gs > 0 else (gd if gd < 0 else 0) %}
          {% set p = states('sensor.deye_microinverter_power') | float(0) %}
          {% set p = p if p > 15 else 0 %}
          {% set b = states('sensor.deye_battery_power') | float(0) %}
          {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
          {% set tarif = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                         else states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set pi = states('input_number.prix_rachat_surplus') | float(0) %}
          {% set conso = [g + p + b, 0] | max %}
          {% set solaire = [p, conso] | min %}
          {% set stocke = [[0 - b, 0] | max, [p - solaire, 0] | max] | min %}
          {% set export = [0 - g, 0] | max %}
          {{ ((solaire * tarif + (export + stocke) * pi) / 1000) | round(4) }}

      - name: "Économie batterie live"
        unique_id: economie_batterie_live
        unit_of_measurement: "€/h"
        state_class: measurement
        state: >
          {% set gs = states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) %}
          {% set gd = states('sensor.deye_grid_power') | float(0) %}
          {% set g = gs if gs > 0 else (gd if gd < 0 else 0) %}
          {% set p = states('sensor.deye_microinverter_power') | float(0) %}
          {% set p = p if p > 15 else 0 %}
          {% set b = states('sensor.deye_battery_power') | float(0) %}
          {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
          {% set tarif = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                         else states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set pi = states('input_number.prix_rachat_surplus') | float(0) %}
          {% set conso = [g + p + b, 0] | max %}
          {% set solaire = [p, conso] | min %}
          {% set stocke = [[0 - b, 0] | max, [p - solaire, 0] | max] | min %}
          {% set export = [0 - g, 0] | max %}
          {{ (((conso - ([g, 0] | max) - solaire) * tarif - stocke * pi) / 1000) | round(4) }}

      # Méthode Urban Solar : montant = kWh injectés × prix du mois (indice CRE × coefficient USE)
      - name: "Rachat surplus live"
        unique_id: rachat_surplus_live
        unit_of_measurement: "€/h"
        state_class: measurement
        state: >
          {% set gs = states('sensor.shellyem_34945478aee1_channel_1_power') | float(0) %}
          {% set gd = states('sensor.deye_grid_power') | float(0) %}
          {% set g = gs if gs > 0 else (gd if gd < 0 else 0) %}
          {% set p = states('sensor.deye_microinverter_power') | float(0) %}
          {% set p = p if p > 15 else 0 %}
          {% set b = states('sensor.deye_battery_power') | float(0) %}
          {% set hc = is_state('binary_sensor.linky_25348914432154_off_peak_hours_active', 'on') %}
          {% set tarif = states('sensor.linky_25348914432154_off_peak_hours_rate') | float(0) if hc
                         else states('sensor.linky_25348914432154_peak_hours_rate') | float(0) %}
          {% set pi = states('input_number.prix_rachat_surplus') | float(0) %}
          {% set conso = [g + p + b, 0] | max %}
          {% set solaire = [p, conso] | min %}
          {% set stocke = [[0 - b, 0] | max, [p - solaire, 0] | max] | min %}
          {% set export = [0 - g, 0] | max %}
          {{ (export * pi / 1000) | round(4) }}

      - name: "Économie totale cumul"
        unique_id: economie_totale_cumul
        unit_of_measurement: "€"
        device_class: monetary
        state_class: total
        state: >
          {{ (states('sensor.economie_solaire_cumul') | float(0)
              + states('sensor.economie_batterie_cumul') | float(0)) | round(4) }}
